<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Shift Rota Generator for Healthcare Institutions">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShiftPlanner">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>ShiftPlanner</title>
<style>
:root{--primary:#6366f1;--accent:#8B6914;--bg:#faf8f4;--surface:#fff;--text:#1e293b;--text-light:#64748b;--border:#e5e0d0;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.app{max-width:1400px;margin:0 auto;padding:1rem}
header{display:flex;flex-wrap:wrap;margin-bottom:.8rem;padding:.5rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,.04)}
header h1{font-size:1.4rem;color:var(--primary)}
header h1 span{font-size:.8rem;color:var(--text-light);font-weight:400;display:block}
header h1 span.app-version{display:inline;font-size:.6rem;color:var(--text-light);font-weight:500;vertical-align:super;opacity:.7}
.controls{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.btn{padding:.45rem .9rem;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-size:.85rem;transition:all .2s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{opacity:.9}
.btn-warn{background:#d97706;color:#fff;border-color:#d97706}
.btn-warn:hover{opacity:.9}
select{padding:.45rem .7rem;border:1px solid var(--border);border-radius:6px;font-size:.85rem;background:var(--surface)}

/* Rota Grid */
.rota-container{overflow-x:auto;margin-bottom:1.2rem;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.rota-table{border-collapse:collapse;width:100%;min-width:860px;font-size:.75rem}
.rota-table th,.rota-table td{border:1px solid var(--border);padding:.2rem .3rem;text-align:center;min-width:28px}
.rota-table th{background:#f8f6f0;font-weight:600;position:sticky;top:0;z-index:2}
.rota-table th.day-header{font-size:.68rem}
.rota-table th.day-header .day-name{display:block;font-size:.6rem;color:var(--text-light);font-weight:400}
.rota-table th.sun{color:#dc2626;font-weight:700}
.rota-table th.sun .day-name{color:#dc2626;font-weight:700}
.rota-table td.name-cell{font-weight:600;text-align:left;padding-left:.4rem;min-width:75px;position:sticky;left:0;background:var(--surface);z-index:1;font-size:.75rem}
.rota-table th.corner-cell{position:sticky;left:0;z-index:3;background:#f8f6f0;min-width:75px;padding:0;overflow:hidden}
.corner-cell-inner{position:relative;width:100%;height:2.4rem;background:linear-gradient(to top right, transparent calc(50% - 0.5px), var(--border) calc(50% - 0.5px), var(--border) calc(50% + 0.5px), transparent calc(50% + 0.5px))}
.corner-label-date{position:absolute;top:2px;right:5px;font-size:.65rem;color:var(--text-light);font-weight:600}
.corner-label-name{position:absolute;bottom:2px;left:5px;font-size:.65rem;color:var(--text-light);font-weight:600}
.rota-table td.shift-cell{cursor:pointer;font-weight:600;font-size:.78rem;transition:all .15s}
.rota-table td.shift-cell:hover{transform:scale(1.08);box-shadow:0 2px 5px rgba(0,0,0,.12)}

/* Shift cell colors */
.shift-M{background:#dbeafe;color:#1e40af}
.shift-G{background:#dcfce7;color:#166534}
.shift-A{background:#fff7ed;color:#9a3412}
.shift-N{background:#f1f5f9;color:#0f172a}
.shift-O{background:#fee2e2;color:#b91c1c;font-weight:700 !important}
.shift-PL{background:#ede9fe;color:#5b21b6;font-weight:700 !important}
.shift-MA{background:#dbeafe;color:#7c2d12}
.shift-AN{background:#f1f5f9;color:#475569}

/* Summary */
.summary-table{border-collapse:collapse;font-size:.78rem;margin-bottom:1.2rem}
.summary-table th,.summary-table td{border:1px solid var(--border);padding:.25rem .5rem;text-align:center}
.summary-table th{background:#f8f6f0;font-weight:600;cursor:pointer}
.summary-table th:hover{opacity:.8}
.summary-table th.active{background:var(--primary) !important;color:#fff !important}
.summary-table th.sh-M{background:#dbeafe;color:#1e40af}
.summary-table th.sh-G{background:#dcfce7;color:#166534}
.summary-table th.sh-A{background:#fff7ed;color:#9a3412}
.summary-table th.sh-N{background:#f1f5f9;color:#0f172a}
.summary-table th.sh-O{background:#fee2e2;color:#b91c1c;font-weight:700}
.summary-table th.sh-PL{background:#ede9fe;color:#5b21b6;font-weight:700}
.summary-table th.sh-MA{background:#dbeafe;color:#7c2d12}
.summary-table th.sh-AN{background:#f1f5f9;color:#475569}
.summary-table td.name-cell{text-align:left;font-weight:600;cursor:pointer}
.summary-table td.name-cell:hover{color:var(--primary)}
.summary-table td.name-cell.active{background:var(--primary);color:#fff}
.summary-table td.count-cell{cursor:pointer}
.summary-table td.count-cell:hover{background:var(--primary);color:#fff;border-radius:2px}
.summary-table td.count-cell.active{background:var(--primary);color:#fff}
.summary-table .total-col{font-weight:700;background:#faf6ec}

/* Inline edit popup */
.inline-popup{position:absolute;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:.4rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;min-width:160px}
.inline-popup .ip-btn{padding:.35rem .2rem;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:.75rem;font-weight:600;text-align:center;background:var(--surface);transition:all .12s}
.inline-popup .ip-btn:hover{border-color:var(--primary);transform:scale(1.05)}
.inline-popup .ip-btn.sel{border-color:var(--primary);background:#eef2ff}

/* Highlight/dim */
.rota-table.has-highlight tr{opacity:0.25;transition:opacity .2s}
.rota-table.has-highlight tr.hl-row{opacity:1}
.rota-table.has-highlight td.hl-cell{opacity:1}
.rota-table.has-highlight tr.hl-partial{opacity:1}
.rota-table.has-highlight tr.hl-partial td:not(.hl-cell):not(.name-cell){opacity:0.25}

/* Coverage */
.coverage-row{display:flex;gap:.3rem;margin-bottom:1rem;flex-wrap:wrap;font-size:.8rem}
.coverage-day{padding:.2rem .4rem;border-radius:4px;border:1px solid var(--border);font-weight:600}
.coverage-day.ok{background:#dcfce7;border-color:#86efac;color:#166534}
.coverage-day.warn{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.coverage-day.danger{background:#fee2e2;border-color:#fca5a5;color:#dc2626}

/* Legend */
.legend{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem;font-size:.85rem;padding:.5rem .8rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.legend-item{display:flex;align-items:center;gap:.3rem}
.legend-swatch{width:22px;height:18px;border-radius:3px;font-size:.7rem;display:flex;align-items:center;justify-content:center;font-weight:700}

/* Tabs */
.tabs{display:flex;gap:.3rem}
.tab{padding:.35rem .75rem;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-size:.82rem;transition:all .2s}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);padding:1.5rem;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{margin-bottom:1rem;color:var(--primary)}
.shift-btn-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:1rem 0}
.shift-btn{padding:.6rem .3rem;border:2px solid var(--border);border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;text-align:center;background:var(--surface);transition:all .15s}
.shift-btn:hover{border-color:var(--primary);transform:scale(1.05)}
.shift-btn.selected{border-color:var(--primary);background:#eef2ff}

/* Alert */
.alert-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;align-items:center;justify-content:center}
.alert-overlay.show{display:flex}
.alert-box{background:var(--surface);border-radius:var(--radius);padding:1.5rem;max-width:420px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.25);border-top:4px solid #f59e0b}

/* Print title - hidden on screen, shown only when printing */
.print-title{display:none}

/* Print */
@media print{
  .no-print{display:none!important}
  .coverage-row{display:none!important}
  /* Outer border around entire page content */
  .app{padding:8px;max-width:100%;border:3px solid #000}
  /* Header: show but clean up for print */
  header{box-shadow:none;border:none;margin-bottom:6px;padding:.3rem .5rem}
  header h1{font-size:12pt}
  header h1 span{font-size:9pt}
  #rota-month-title{font-size:11pt!important;text-align:center!important;flex:1!important;margin:0!important}
  /* Tabs: hide the inactive one, style the active as a label */
  .tabs .tab{display:none!important}
  .tabs .tab.active{display:inline-block!important;background:none!important;border:none!important;color:#1e293b!important;font-weight:700;font-size:10pt;padding:0;cursor:default}
  /* Legend: show inline, smaller */
  .legend{font-size:8pt!important}
  .legend-item{gap:2px}
  .legend-swatch{width:16px;height:14px;font-size:7pt}
  /* Rota table - uniform 1.5px borders */
  .rota-table{font-size:9pt;min-width:unset;width:100%;border-collapse:collapse;border:1.5px solid #000}
  .rota-table th,.rota-table td{padding:2px 3px;border:1.5px solid #000;position:static!important}
  .rota-table th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rota-table th.day-header{font-size:8pt;border:1.5px solid #000}
  .rota-table th.corner-cell{border:1.5px solid #000;position:static!important}
  .rota-table td.name-cell{position:static!important;border:1.5px solid #000}
  .rota-table td.shift-cell{-webkit-print-color-adjust:exact;print-color-adjust:exact;border:1.5px solid #000}
  .rota-table td.shift-cell:hover{transform:none;box-shadow:none}
  .rota-container{border:none;box-shadow:none;border-radius:0;overflow:visible;margin-bottom:8px}
  /* Summary table - uniform 1.5px borders */
  .summary-table{font-size:9pt;margin-bottom:0;border:1.5px solid #000}
  .summary-table th,.summary-table td{padding:2px 4px;border:1.5px solid #000}
  .summary-table th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* General */
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:0.8cm}
}
@media(max-width:768px){
  .app{padding:.5rem}
  header{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;width:100%">
      <h1>ShiftPlanner <span id="app-version" class="app-version" title="App version"></span> <span id="org-name" onclick="SP.editOrgName()" title="Click to change organisation name" style="cursor:pointer"></span></h1>
      <h2 id="rota-month-title" style="font-size:1rem;color:var(--accent);margin:0;text-align:center;flex:1"></h2>
      <div class="controls no-print">
        <select id="month-select" onchange="SP.changeMonth(this.value)"></select>
        <button class="btn btn-primary" id="btn-generate" onclick="SP.generateRota()">Generate</button>
        <button class="btn btn-warn" onclick="SP.saveManual()" id="btn-save" style="display:none">Save</button>
        <button class="btn" onclick="SP.undoLast()" id="btn-undo" style="display:none">Undo</button>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);margin-top:.5rem;padding-top:.4rem;width:100%">
      <div class="tabs" style="margin:0">
        <div class="tab active" id="tab-nurses" onclick="SP.switchTab('nurses')">Nurses</div>
        <div class="tab" id="tab-housekeeping" onclick="SP.switchTab('housekeeping')">HouseKeeping</div>
      </div>
      <div class="legend" style="margin:0;border:none;padding:0;box-shadow:none;background:none;justify-content:center;flex:1">
        <div class="legend-item"><div class="legend-swatch shift-M">M</div>8AM-2PM</div>
        <div class="legend-item"><div class="legend-swatch shift-G">G</div>10AM-6PM</div>
        <div class="legend-item"><div class="legend-swatch shift-A">A</div>2PM-8PM</div>
        <div class="legend-item"><div class="legend-swatch shift-N">N</div>8PM-8AM</div>
        <div class="legend-item"><div class="legend-swatch shift-O">O</div>Day Off</div>
        <div class="legend-item"><div class="legend-swatch shift-PL">PL</div>Leave</div>
        <div class="legend-item"><div class="legend-swatch shift-MA">MA</div>M+A</div>
        <div class="legend-item"><div class="legend-swatch shift-AN">AN</div>A+N</div>
      </div>
      <div class="no-print" style="display:flex;gap:.5rem">
        <button class="btn" onclick="SP.showSetup()">Staff Setup</button>
        <button class="btn" onclick="SP.exportPDF()">Export PDF</button>
      </div>
    </div>
  </header>

  <div id="rota-content"></div>

  <div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
  <div class="alert-overlay" id="alert-overlay"><div class="alert-box" id="alert-box"></div></div>
</div>

<script src="rules.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(e){console.warn('SW registration failed:',e)})}
</script>
</body>
</html>
